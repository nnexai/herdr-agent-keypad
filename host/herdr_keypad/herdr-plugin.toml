id = "herdr-keypad"
name = "herdr-keypad"
version = "0.1.0"
description = "Exact installed inbox projection and focus-only USB keypad bridge."
min_herdr_version = "0.8.0"
platforms = ["linux"]

[[startup]]
command = ["/bin/sh", "scripts/ensure-bridge.sh"]

[[events]]
on = "pane.agent_detected"
command = ["/bin/sh", "scripts/ensure-bridge.sh"]
