[package]
name = "herdr-keypad-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "herdr_keypad_native"
path = "src/lib.rs"

[[bin]]
name = "herdr-keypad-native"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio-serial = { version = "=5.5.0", default-features = false }
serialport = { version = "=4.10.0", default-features = false, features = ["usbportinfo-interface"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "ansi"] }
toml = "=1.1.4"
sha2 = "=0.11.0"
fs2 = "=0.4.3"
github-copilot-sdk = { version = "=1.0.13-preview.2", default-features = false }
