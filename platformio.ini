[platformio]
default_envs = selected-usb
src_dir = firmware/src
test_dir = test

[env:selected-usb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; pioarduino 55.03.311 carries Arduino-ESP32 3.3.11.
; Official T-Keyboard-S3-Pro Library 0.1.0 is locked to the immutable commit below.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
upload_speed = 115200
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=0
build_src_filter =
  +<*>
  -<transport/wifi_tls.cpp>
  -<feasibility/composite_probe.cpp>
lib_deps =
  https://github.com/Xinyuan-LilyGO/T-Keyboard-S3-Pro-Library.git#c46c4cb5752c04bca417c1f959dac6f5acdb5142
  https://github.com/lbuque/ButtonSense.git#b1aeb22a73c523b37ebd11bee54000b77484f76c
  lovyan03/LovyanGFX@1.2.26
  bblanchon/ArduinoJson@7.4.3

[env:composite-feasibility]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; Isolated Phase 03.2 gate; selected-usb now uses the accepted mode-0 tuple.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
upload_speed = 115200
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=0
build_src_filter =
  -<*>
  +<feasibility/composite_probe.cpp>
  +<transport/fixed_space_hid.cpp>
lib_deps =
  https://github.com/Xinyuan-LilyGO/T-Keyboard-S3-Pro-Library.git#c46c4cb5752c04bca417c1f959dac6f5acdb5142
  https://github.com/lbuque/ButtonSense.git#b1aeb22a73c523b37ebd11bee54000b77484f76c
  lovyan03/LovyanGFX@1.2.26
  bblanchon/ArduinoJson@7.4.3

[env:native]
platform = native
test_framework = unity
test_filter = protocol
build_src_filter = +<protocol/**>
test_build_src = yes
build_flags =
  -DPHASE1_GOLDEN_FIXTURE=\"${PROJECT_DIR}/protocol/fixtures/v1-golden.json\"
  -DPHASE2_GOLDEN_FIXTURE=\"${PROJECT_DIR}/protocol/fixtures/v2-golden.json\"
lib_deps =
  throwtheswitch/Unity@2.6.0


[env:native-agent-projection]
platform = native
test_filter = test_agent_projection
test_build_src = yes
build_src_filter =
  +<app/agent_projection.cpp>
  +<app/settings_store.cpp>
  +<app/menu_controller.cpp>
  +<app/product_input_router.cpp>
  +<ui/theme_signal_edge.cpp>
  +<ui/theme_ledger.cpp>
  +<ui/theme_beacon.cpp>
  +<ui/led_engine.cpp>
  +<ui/led_grammar_rail_echo.cpp>
  +<ui/led_grammar_exception.cpp>
  +<ui/led_grammar_field_ext.cpp>
  +<ui/led_grammar_meter_lamps.cpp>
  +<ui/theme_instrument.cpp>
build_flags =
  -I test/test_agent_projection/stubs
lib_deps =
  throwtheswitch/Unity@2.6.0
  bblanchon/ArduinoJson@7.4.3
[env:native-hold-controller]
platform = native
test_framework = unity
test_filter = test_hold_controller
test_build_src = yes
build_src_filter =
  +<app/hold_controller.cpp>
build_flags =
  -I firmware/src
lib_deps =
  throwtheswitch/Unity@2.6.0