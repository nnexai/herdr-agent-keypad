name: Native release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86-64 unsigned bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Build, test, inspect, and package two clean Linux roots
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-gnu
          PLUGIN: host/herdr_keypad
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/herdr-keypad-$TARGET"
          rm -rf "$WORK"
          mkdir -p "$WORK/root-a" "$WORK/root-b" "$WORK/out"

          # These are independent archive streams of the exact workflow commit.
          git archive --format=tar "$GITHUB_SHA" > "$WORK/source-a.tar"
          tar -xf "$WORK/source-a.tar" -C "$WORK/root-a"
          git archive --format=tar "$GITHUB_SHA" > "$WORK/source-b.tar"
          tar -xf "$WORK/source-b.tar" -C "$WORK/root-b"
          test -f "$WORK/root-a/$PLUGIN/native/rust-toolchain.toml"
          test -f "$WORK/root-b/$PLUGIN/native/rust-toolchain.toml"

          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' "$WORK/root-a/$PLUGIN/native/rust-toolchain.toml" | head -n 1)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup show active-toolchain

          (
            cd "$WORK/root-a"
            export CARGO_HOME="$WORK/cargo-home-a"
            export CARGO_TARGET_DIR="$WORK/target-a"
            export CARGO_INCREMENTAL=0
            export RUSTFLAGS="--remap-path-prefix=$WORK/root-a=/workspace --remap-path-prefix=$WORK/cargo-home-a=/deps --remap-path-prefix=$WORK/target-a=/build"
            export RUSTUP_TOOLCHAIN="$TOOLCHAIN"
            cargo test --locked --manifest-path "$PLUGIN/native/Cargo.toml" --test release_bundle
            cargo test --locked --manifest-path "$PLUGIN/native/Cargo.toml" --test usb_platform
            cargo build --release --locked --target x86_64-unknown-linux-gnu --manifest-path "$PLUGIN/native/Cargo.toml"
          )
          (
            cd "$WORK/root-b"
            export CARGO_HOME="$WORK/cargo-home-b"
            export CARGO_TARGET_DIR="$WORK/target-b"
            export CARGO_INCREMENTAL=0
            export RUSTFLAGS="--remap-path-prefix=$WORK/root-b=/workspace --remap-path-prefix=$WORK/cargo-home-b=/deps --remap-path-prefix=$WORK/target-b=/build"
            export RUSTUP_TOOLCHAIN="$TOOLCHAIN"
            cargo test --locked --manifest-path "$PLUGIN/native/Cargo.toml" --test release_bundle
            cargo test --locked --manifest-path "$PLUGIN/native/Cargo.toml" --test usb_platform
            cargo build --release --locked --target x86_64-unknown-linux-gnu --manifest-path "$PLUGIN/native/Cargo.toml"
          )

          BIN_A="$WORK/target-a/$TARGET/release/herdr-keypad-native"
          BIN_B="$WORK/target-b/$TARGET/release/herdr-keypad-native"
          test -x "$BIN_A" && test -x "$BIN_B"
          HASH_A="$(sha256sum "$BIN_A" | cut -d ' ' -f 1)"
          HASH_B="$(sha256sum "$BIN_B" | cut -d ' ' -f 1)"
          printf 'binary_a_sha256=%s\nbinary_b_sha256=%s\n' "$HASH_A" "$HASH_B"
          test "$HASH_A" = "$HASH_B"
          readelf -h "$BIN_A"
          ldd "$BIN_A"
          readelf -h "$BIN_B"
          ldd "$BIN_B"

          mkdir -p "$WORK/out/bin"
          cp "$WORK/root-a/$PLUGIN/herdr-plugin.toml" "$WORK/out/herdr-plugin.toml"
          cp "$WORK/root-a/$PLUGIN/LIFECYCLE.md" "$WORK/out/LIFECYCLE.md"
          cp "$BIN_A" "$WORK/out/bin/herdr-keypad"
          python3 "$WORK/root-a/$PLUGIN/release/verify_bundle.py" \
            --write-manifest \
            --output "$WORK/out/release-manifest.json" \
            --schema "$WORK/root-a/$PLUGIN/bundle/manifest.schema.json" \
            --plugin-root "$WORK/root-a/$PLUGIN" \
            --binary "$WORK/out/bin/herdr-keypad" \
            --binary-b "$BIN_B" \
            --target "$TARGET" \
            --source-revision "$GITHUB_SHA" \
            --source-archive-a "$WORK/source-a.tar" \
            --source-archive-b "$WORK/source-b.tar" \
            --cargo-lock "$WORK/root-a/$PLUGIN/native/Cargo.lock" \
            --toolchain "$TOOLCHAIN" \
            --rustc "$(rustc --version)" \
            --cargo "$(cargo --version)" \
            --test-command "cargo test --locked --manifest-path $PLUGIN/native/Cargo.toml --test release_bundle"
          python3 "$WORK/root-a/$PLUGIN/release/verify_bundle.py" \
            --bundle "$WORK/out" \
            --target "$TARGET" \
            --schema "$WORK/root-a/$PLUGIN/bundle/manifest.schema.json" \
            --source-revision "$GITHUB_SHA"
          grep -q '"status": "not-run"' "$WORK/out/release-manifest.json"
          sha256sum "$WORK/source-a.tar" > "$WORK/out/source-a.sha256"
          sha256sum "$WORK/source-b.tar" > "$WORK/out/source-b.sha256"
          sha256sum "$BIN_A" > "$WORK/out/binary-a.sha256"
          sha256sum "$BIN_B" > "$WORK/out/binary-b.sha256"
          printf 'source_revision=%s\nsource_a_sha256=%s\nsource_b_sha256=%s\nbinary_a_sha256=%s\nbinary_b_sha256=%s\n' \
            "$GITHUB_SHA" "$(cut -d ' ' -f 1 "$WORK/out/source-a.sha256")" \
            "$(cut -d ' ' -f 1 "$WORK/out/source-b.sha256")" "$HASH_A" "$HASH_B" \
            > "$WORK/out/provenance-$TARGET.txt"
          tar -czf "$WORK/out/herdr-keypad-$TARGET.tar.gz" -C "$WORK/out" \
            herdr-plugin.toml LIFECYCLE.md bin/herdr-keypad release-manifest.json

          ARCHIVE_SHA="$(sha256sum "$WORK/out/herdr-keypad-$TARGET.tar.gz" | cut -d ' ' -f 1)"
          MANIFEST_SHA="$(sha256sum "$WORK/out/release-manifest.json" | cut -d ' ' -f 1)"
          PROVENANCE_SHA="$(sha256sum "$WORK/out/provenance-$TARGET.txt" | cut -d ' ' -f 1)"
          cat > "$WORK/out/phase04-linux-evidence.json" <<EOF
          {
            "schema_version": 1,
            "kind": "phase04-producer",
            "source_revision": "$GITHUB_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_ref": "$GITHUB_REF",
            "target": "$TARGET",
            "archive_name": "herdr-keypad-$TARGET.tar.gz",
            "archive_sha256": "$ARCHIVE_SHA",
            "manifest_name": "release-manifest.json",
            "manifest_sha256": "$MANIFEST_SHA",
            "provenance_name": "provenance-$TARGET.txt",
            "provenance_sha256": "$PROVENANCE_SHA",
            "binary_sha256": "$HASH_A",
            "source_a_sha256": "$(cut -d ' ' -f 1 "$WORK/out/source-a.sha256")",
            "source_b_sha256": "$(cut -d ' ' -f 1 "$WORK/out/source-b.sha256")",
            "binary_a_sha256": "$HASH_A",
            "binary_b_sha256": "$HASH_B",
            "reproducibility": {"status": "passed"},
            "tests": {"status": "passed"},
            "resource": {"status": "not-run"}
          }
          EOF
          python3 -m json.tool "$WORK/out/phase04-linux-evidence.json" >/dev/null

      - name: Upload Linux unsigned bundle and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: herdr-keypad-linux-x86_64-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/herdr-keypad-x86_64-unknown-linux-gnu/out

  macos-arm64:
    name: macOS Apple Silicon unsigned bundle
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Build, test, inspect, and package two clean Apple Silicon roots
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
          PLUGIN: host/herdr_keypad
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "macOS release requires an Apple Silicon arm64 runner" >&2
            exit 1
          fi
          WORK="$RUNNER_TEMP/herdr-keypad-$TARGET"
          rm -rf "$WORK"
          mkdir -p "$WORK/root-a" "$WORK/root-b" "$WORK/out"

          # Each source root is a fresh extraction of the commit being released.
          git archive --format=tar "$GITHUB_SHA" > "$WORK/source-a.tar"
          tar -xf "$WORK/source-a.tar" -C "$WORK/root-a"
          git archive --format=tar "$GITHUB_SHA" > "$WORK/source-b.tar"
          tar -xf "$WORK/source-b.tar" -C "$WORK/root-b"
          test -f "$WORK/root-a/$PLUGIN/native/rust-toolchain.toml"
          test -f "$WORK/root-b/$PLUGIN/native/rust-toolchain.toml"

          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' "$WORK/root-a/$PLUGIN/native/rust-toolchain.toml" | head -n 1)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup show active-toolchain

          (
            cd "$WORK/root-a"
            export CARGO_HOME="$WORK/cargo-home-a"
            export CARGO_TARGET_DIR="$WORK/target-a"
            export CARGO_INCREMENTAL=0
            export RUSTFLAGS="--remap-path-prefix=$WORK/root-a=/workspace --remap-path-prefix=$WORK/cargo-home-a=/deps --remap-path-prefix=$WORK/target-a=/build"
            export RUSTUP_TOOLCHAIN="$TOOLCHAIN"
            cargo test --locked --manifest-path "$PLUGIN/native/Cargo.toml" --test release_bundle
            cargo test --locked --manifest-path "$PLUGIN/native/Cargo.toml" --test usb_platform macos_
            cargo build --release --locked --target aarch64-apple-darwin --manifest-path "$PLUGIN/native/Cargo.toml"
          )
          (
            cd "$WORK/root-b"
            export CARGO_HOME="$WORK/cargo-home-b"
            export CARGO_TARGET_DIR="$WORK/target-b"
            export CARGO_INCREMENTAL=0
            export RUSTFLAGS="--remap-path-prefix=$WORK/root-b=/workspace --remap-path-prefix=$WORK/cargo-home-b=/deps --remap-path-prefix=$WORK/target-b=/build"
            export RUSTUP_TOOLCHAIN="$TOOLCHAIN"
            cargo test --locked --manifest-path "$PLUGIN/native/Cargo.toml" --test release_bundle
            cargo test --locked --manifest-path "$PLUGIN/native/Cargo.toml" --test usb_platform macos_
            cargo build --release --locked --target aarch64-apple-darwin --manifest-path "$PLUGIN/native/Cargo.toml"
          )

          BIN_A="$WORK/target-a/$TARGET/release/herdr-keypad-native"
          BIN_B="$WORK/target-b/$TARGET/release/herdr-keypad-native"
          test -x "$BIN_A" && test -x "$BIN_B"
          HASH_A="$(shasum -a 256 "$BIN_A" | cut -d ' ' -f 1)"
          HASH_B="$(shasum -a 256 "$BIN_B" | cut -d ' ' -f 1)"
          printf 'binary_a_sha256=%s\nbinary_b_sha256=%s\n' "$HASH_A" "$HASH_B"
          test "$HASH_A" = "$HASH_B"
          otool -hv "$BIN_A"
          otool -L "$BIN_A"
          otool -hv "$BIN_B"
          otool -L "$BIN_B"

          mkdir -p "$WORK/out/bin"
          cp "$WORK/root-a/$PLUGIN/herdr-plugin.toml" "$WORK/out/herdr-plugin.toml"
          cp "$WORK/root-a/$PLUGIN/LIFECYCLE.md" "$WORK/out/LIFECYCLE.md"
          cp "$BIN_A" "$WORK/out/bin/herdr-keypad"
          python3 "$WORK/root-a/$PLUGIN/release/verify_bundle.py" \
            --write-manifest \
            --output "$WORK/out/release-manifest.json" \
            --schema "$WORK/root-a/$PLUGIN/bundle/manifest.schema.json" \
            --plugin-root "$WORK/root-a/$PLUGIN" \
            --binary "$WORK/out/bin/herdr-keypad" \
            --binary-b "$BIN_B" \
            --target "$TARGET" \
            --source-revision "$GITHUB_SHA" \
            --source-archive-a "$WORK/source-a.tar" \
            --source-archive-b "$WORK/source-b.tar" \
            --cargo-lock "$WORK/root-a/$PLUGIN/native/Cargo.lock" \
            --toolchain "$TOOLCHAIN" \
            --rustc "$(rustc --version)" \
            --cargo "$(cargo --version)" \
            --test-command "cargo test --locked --manifest-path $PLUGIN/native/Cargo.toml --test release_bundle"
          python3 "$WORK/root-a/$PLUGIN/release/verify_bundle.py" \
            --bundle "$WORK/out" \
            --target "$TARGET" \
            --schema "$WORK/root-a/$PLUGIN/bundle/manifest.schema.json" \
            --source-revision "$GITHUB_SHA"
          grep -q '"status": "not-run"' "$WORK/out/release-manifest.json"
          shasum -a 256 "$WORK/source-a.tar" > "$WORK/out/source-a.sha256"
          shasum -a 256 "$WORK/source-b.tar" > "$WORK/out/source-b.sha256"
          shasum -a 256 "$BIN_A" > "$WORK/out/binary-a.sha256"
          shasum -a 256 "$BIN_B" > "$WORK/out/binary-b.sha256"
          printf 'source_revision=%s\nsource_a_sha256=%s\nsource_b_sha256=%s\nbinary_a_sha256=%s\nbinary_b_sha256=%s\n' \
            "$GITHUB_SHA" "$(cut -d ' ' -f 1 "$WORK/out/source-a.sha256")" \
            "$(cut -d ' ' -f 1 "$WORK/out/source-b.sha256")" "$HASH_A" "$HASH_B" \
            > "$WORK/out/provenance-$TARGET.txt"
          tar -czf "$WORK/out/herdr-keypad-$TARGET.tar.gz" -C "$WORK/out" \
            herdr-plugin.toml LIFECYCLE.md bin/herdr-keypad release-manifest.json

          ARCHIVE_SHA="$(shasum -a 256 "$WORK/out/herdr-keypad-$TARGET.tar.gz" | cut -d ' ' -f 1)"
          MANIFEST_SHA="$(shasum -a 256 "$WORK/out/release-manifest.json" | cut -d ' ' -f 1)"
          PROVENANCE_SHA="$(shasum -a 256 "$WORK/out/provenance-$TARGET.txt" | cut -d ' ' -f 1)"
          cat > "$WORK/out/phase04-macos-evidence.json" <<EOF
          {
            "schema_version": 1,
            "kind": "phase04-producer",
            "source_revision": "$GITHUB_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_ref": "$GITHUB_REF",
            "target": "$TARGET",
            "archive_name": "herdr-keypad-$TARGET.tar.gz",
            "archive_sha256": "$ARCHIVE_SHA",
            "manifest_name": "release-manifest.json",
            "manifest_sha256": "$MANIFEST_SHA",
            "provenance_name": "provenance-$TARGET.txt",
            "provenance_sha256": "$PROVENANCE_SHA",
            "binary_sha256": "$HASH_A",
            "source_a_sha256": "$(cut -d ' ' -f 1 "$WORK/out/source-a.sha256")",
            "source_b_sha256": "$(cut -d ' ' -f 1 "$WORK/out/source-b.sha256")",
            "binary_a_sha256": "$HASH_A",
            "binary_b_sha256": "$HASH_B",
            "reproducibility": {"status": "passed"},
            "tests": {"status": "passed"},
            "resource": {"status": "not-run"}
          }
          EOF
          python3 -m json.tool "$WORK/out/phase04-macos-evidence.json" >/dev/null

      - name: Upload macOS unsigned bundle and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: herdr-keypad-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/herdr-keypad-aarch64-apple-darwin/out

  linux-phase4-contract:
    name: Linux Phase 04 parity and resource contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run focused contract and production smoke
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-gnu
          PLUGIN: host/herdr_keypad
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/herdr-keypad-phase04-contract"
          rm -rf "$WORK"
          mkdir -p "$WORK/out" "$WORK/config" "$WORK/state" "$WORK/home/.config/herdr"
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' "$PLUGIN/native/rust-toolchain.toml" | head -n 1)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET"
          export RUSTUP_TOOLCHAIN="$TOOLCHAIN"
          export CARGO_HOME="$WORK/cargo-home"
          export CARGO_TARGET_DIR="$WORK/target"
          if ! cargo test --locked --manifest-path "$PLUGIN/native/Cargo.toml" \
            --test black_box_parity --test resource_bounds --test production_surface \
            -- --test-threads=1 > "$WORK/contract-tests.log" 2>&1; then
            cat "$WORK/contract-tests.log"
            exit 1
          fi
          cat "$WORK/contract-tests.log"
          cargo build --release --locked --target "$TARGET" --manifest-path "$PLUGIN/native/Cargo.toml"
          BIN="$WORK/target/$TARGET/release/herdr-keypad-native"
          test -x "$BIN"
          printf 'logging_enabled = false\n' > "$WORK/config/config.toml"
          PATH="" HOME="$WORK/home" \
            HERDR_PLUGIN_CONFIG_DIR="$WORK/config" \
            HERDR_PLUGIN_STATE_DIR="$WORK/state" \
            HERDR_SOCKET_PATH="$WORK/herdr.sock" \
            HERDR_BIN_PATH="/bin/true" HERDR_PID="0" \
            "$BIN" status > "$WORK/production-smoke.json"
          python3 -m json.tool "$WORK/production-smoke.json" >/dev/null
          TEST_BYTES="$(wc -c < "$WORK/contract-tests.log" | tr -d ' ')"
          TEST_LINES="$(wc -l < "$WORK/contract-tests.log" | tr -d ' ')"
          TEST_SHA="$(sha256sum "$WORK/contract-tests.log" | cut -d ' ' -f 1)"
          SMOKE_BYTES="$(wc -c < "$WORK/production-smoke.json" | tr -d ' ')"
          SMOKE_SHA="$(sha256sum "$WORK/production-smoke.json" | cut -d ' ' -f 1)"
          cat > "$WORK/out/phase04-linux-contract.json" <<EOF
          {
            "schema_version": 1,
            "kind": "phase04-contract",
            "source_revision": "$GITHUB_SHA",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_ref": "$GITHUB_REF",
            "target": "$TARGET",
            "tests": {
              "status": "passed",
              "output_sha256": "$TEST_SHA",
              "output_bytes": $TEST_BYTES,
              "line_count": $TEST_LINES
            },
            "resource": {
              "status": "passed",
              "output_sha256": "$TEST_SHA",
              "output_bytes": $TEST_BYTES
            },
            "production_smoke": {
              "status": "passed",
              "output_sha256": "$SMOKE_SHA",
              "output_bytes": $SMOKE_BYTES
            }
          }
          EOF
          python3 -m json.tool "$WORK/out/phase04-linux-contract.json" >/dev/null

      - name: Upload Linux contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: herdr-keypad-phase04-contract-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/herdr-keypad-phase04-contract/out

  aggregate-phase4-evidence:
    name: Aggregate Phase 04 release evidence
    needs:
      - linux-x86_64
      - macos-arm64
      - linux-phase4-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download Linux native evidence for this run and commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: herdr-keypad-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/phase04-input/linux

      - name: Download macOS native evidence for this run and commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: herdr-keypad-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/phase04-input/macos

      - name: Download Linux contract evidence for this run and commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: herdr-keypad-phase04-contract-${{ github.sha }}
          path: ${{ runner.temp }}/phase04-input/contract

      - name: Collect and verify hash-linked evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/phase04-output"
          mkdir -p "$OUT"
          python3 host/herdr_keypad/release/collect_phase4_evidence.py \
            --input-root "$RUNNER_TEMP/phase04-input" \
            --source-root "$GITHUB_WORKSPACE" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-ref "$GITHUB_REF" \
            --output "$OUT/phase04-release-evidence.json" \
            --checksum "$OUT/phase04-release-evidence.json.sha256"
          sha256sum -c "$OUT/phase04-release-evidence.json.sha256"

      - name: Upload final Phase 04 evidence and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: herdr-keypad-phase04-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/phase04-output/phase04-release-evidence.json
            ${{ runner.temp }}/phase04-output/phase04-release-evidence.json.sha256
