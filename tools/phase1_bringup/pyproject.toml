[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase1-bringup"
version = "0.1.0"
description = "Guided physical keypad and bounded USB tracer"
requires-python = ">=3.11,<3.15"
dependencies = ["pyserial==3.5", "jsonschema==4.25.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
